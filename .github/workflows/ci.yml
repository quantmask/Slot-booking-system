name: Slotbook CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: slotbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/slotbook
        run: npx tsx backend/scripts/migrate.ts

      - name: Run Full Test Suite (Concurrency, Slot Engine, Extensions, Workers, API)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/slotbook
        run: npm test

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

